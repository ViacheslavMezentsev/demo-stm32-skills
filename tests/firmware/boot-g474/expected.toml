# Expected boot log of tests/firmware/boot-g474 (format: stm32-renode-emulator/assets/expected.example.toml).
emulator = "renode"
machine = "stm32g4_mock"

min_lines = 5
first_line = "^boot: start$"
last_line = "^boot: done$"

[require]
lines = [
    "^CPU: Cortex-M4 \\(CPUID 0x410FC24[0-9A-F]\\)$",
    "^Firmware: v{version} build {build}\\.{revision}$",
    "^Telemetry state: 0x000000A5$",
]

[forbid]
lines = ["Cortex-M7", "Cortex-M\\?"]
